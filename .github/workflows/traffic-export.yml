name: Export repository traffic

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-traffic-history
  cancel-in-progress: false

jobs:
  export:
    name: Collect repository traffic
    if: github.ref == 'refs/heads/main'
    environment: analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline collector tests before credentialed collection
        run: python3 -m unittest discover -s tests/tooling -p test_traffic_history.py -v
      # App credentials are analytics environment values. Only the token action
      # receives the key; only curl receives its short-lived installation token.
      - name: Check the traffic App configuration
        env:
          CLIENT_ID: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::TRAFFIC_APP_CLIENT_ID or TRAFFIC_APP_PRIVATE_KEY is not set in the analytics environment"
            exit 1
          fi
      - name: Prepare traffic response directory
        run: mkdir -p "$RUNNER_TEMP/traffic-raw"
      - name: Create the traffic App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          permission-administration: read
      - name: Fetch traffic from the GitHub API
        env:
          TRAFFIC_API_TOKEN: ${{ steps.app-token.outputs.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/traffic
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 60 --max-filesize 8388608 \
            -H "Authorization: Bearer $TRAFFIC_API_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/views?per=day" -o "$RUNNER_TEMP/traffic-raw/views.json"
          curl --fail --silent --show-error --retry 3 --max-time 60 --max-filesize 8388608 \
            -H "Authorization: Bearer $TRAFFIC_API_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/clones?per=day" -o "$RUNNER_TEMP/traffic-raw/clones.json"
          curl --fail --silent --show-error --retry 3 --max-time 60 --max-filesize 8388608 \
            -H "Authorization: Bearer $TRAFFIC_API_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/popular/referrers" -o "$RUNNER_TEMP/traffic-raw/referrers.json"
          curl --fail --silent --show-error --retry 3 --max-time 60 --max-filesize 8388608 \
            -H "Authorization: Bearer $TRAFFIC_API_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/popular/paths" -o "$RUNNER_TEMP/traffic-raw/paths.json"
      # Publication uses only the built-in contents-write token, never the App token.
      - name: Merge and atomically publish aggregate traffic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_RAW: ${{ runner.temp }}/traffic-raw
        run: python3 tools/traffic_history.py
