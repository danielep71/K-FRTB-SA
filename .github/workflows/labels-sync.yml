name: Sync issue labels

# Pull requests validate without write permission. Only a trusted push to main
# or an explicit manual dispatch can reconcile the live repository taxonomy.
# The script validates and self-tests before the first API mutation, then
# verifies an exact post-run match.

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - .github/labels.json
      - .github/label-policy.json
      - .github/scripts/labels-sync.mjs
      - .github/scripts/labels-drift.mjs
      - .github/workflows/labels-sync.yml
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/label-policy.json
      - .github/scripts/labels-sync.mjs
      - .github/scripts/labels-drift.mjs
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate label manifest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --self-test

      - name: Validate the canonical manifest
        run: node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --mode validate

  reconcile:
    name: Reconcile live labels
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the exact SHA to apply
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise validation, overlays, and reconciliation paths
        run: node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --self-test

      - name: Retain the pre-reconciliation catalogue and plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p test-results
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/labels?per_page=100" > test-results/labels-pages-before.json
          jq 'add' test-results/labels-pages-before.json > test-results/labels-before.json
          node .github/scripts/labels-sync.mjs --mode plan --live test-results/labels-before.json | tee test-results/labels-plan.md

      - name: Refuse to prune labels that still have issue or PR associations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -r --slurpfile manifest .github/labels.json '
            .[] | .name as $name |
            select(all($manifest[0].core[]; (.name | ascii_downcase) != ($name | ascii_downcase))) |
            .name' test-results/labels-before.json > test-results/labels-removals.txt
          while IFS= read -r label; do
            gh api --method GET "repos/${GITHUB_REPOSITORY}/issues" \
              -f state=all -f labels="$label" -f per_page=1 > test-results/labels-associations.json
            if [[ "$(jq 'length' test-results/labels-associations.json)" != "0" ]]; then
              echo "::error::Pruning would remove a used label. Review labels-removals.txt and migrate its associations first."
              exit 1
            fi
          done < test-results/labels-removals.txt

      - name: Reconcile and verify the versioned label selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/labels-sync.mjs --policy .github/label-policy.json --mode reconcile --repository "${GITHUB_REPOSITORY}" | tee test-results/labels-sync.md

      - name: Verify the resulting catalogue with the read-only detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/labels-drift.mjs --self-test
          node .github/scripts/labels-drift.mjs --repository "${GITHUB_REPOSITORY}" --output test-results/labels-after.json --summary test-results/labels-after.md

      - name: Retain reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: label-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/labels-*
          if-no-files-found: error
          retention-days: 30
