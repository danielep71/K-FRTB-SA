name: "🐛 Bug report"
description: "Report reproducible incorrect behavior in the workbook, the reference, the tooling or a documented contract."
title: "[Bug]: "
labels: ["bug", "P2"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug report

        **Reproducible · Exact commit · Sourced expected value · Synthetic data only**

        Name the exact commit, give steps anyone can repeat, and state where the expected value comes from. I set the milestone and confirm the priority: `P2` by default, `P1` only for a confirmed calculation bug, that is, wrong results for valid inputs.

        > [!CAUTION]
        > Synthetic data only: never paste real positions, sensitivities, counterparties, credentials or private workbooks. Report a vulnerability privately as [`SECURITY.md`](https://github.com/danielep71/K-FRTB-SA/blob/main/SECURITY.md) describes, never in an issue.

  - type: dropdown
    id: area
    attributes:
      label: "🎚️ Affected area"
      options:
        - Calculation engine (VBA)
        - Python reference and tests
        - Workbook template and layout
        - Excel tooling (build, sync, export)
        - CI and repository tooling
        - Documentation
        - Repository and governance
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "🎯 Defect and impact"
      description: What is wrong, who is affected and what the consequence is. For a calculation defect, name the affected risk class, component and output.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: "🔖 Exact commit"
      description: Full 40-character commit SHA, or the version on the workbook README sheet, that reproduces the defect.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "🔁 Minimal reproduction"
      description: Deterministic steps and the smallest synthetic input rows that show the defect.
      placeholder: |
        1. Build the workbook from the commit above
        2. Enter these rows on In_Delta: ...
        3. Run FRTB-SA and read ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected behavior"
      description: The expected result, error or state, with its source (the MAR paragraph, a published example, or a derivation independent of this repository's code).
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Observed behavior"
      description: Exact values, Log messages or tool output, and whether the failure repeats.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "🖥️ Environment"
      description: Write "N/A" for tooling or documentation defects that do not depend on the host.
      value: |
        Excel version/build, or LibreOffice version:
        Office bitness:
        Windows version:
        Locale / decimal separator:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🏁 Acceptance criteria"
      description: Checkable conditions for the fix, including the regression test that must pass.
      placeholder: |
        - [ ] ...
        - [ ] Reference or regression test with a sourced expected value
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🧪 Validation evidence required"
      description: The checks that will prove the fix, for example `REQUIRE_LIBREOFFICE=1 python -m pytest tests`, a reference case, or an Excel run recorded under docs/EXCEL_EVIDENCE.md.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "🔗 Dependencies and blocking status"
      description: Name each prerequisite as an issue link (#12) or on a line starting "External condition:". Write "None" if nothing blocks this work. `blocked` applies only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "☑️ Submission checks"
      options:
        - label: I searched open and closed issues for an equivalent report.
          required: true
        - label: I reproduced this on the exact commit stated above.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: This report contains only synthetic data and no secrets, private links or vulnerability details.
          required: true
