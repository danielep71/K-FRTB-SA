name: ✨ Feature or improvement
description: Define a bounded improvement with acceptance criteria and validation.
labels:
- enhancement
- P3
assignees:
- danielep71
body:
- type: markdown
  attributes:
    value: '## 🧭 Before you submit

      Prototype and repository-maintenance work integrates on release/v0.2.0 (milestone 2, v0.2.0 — SA prototype); release/v0.1.0 is superseded. The setup branch release/v0.0.1 was deleted after the setup closeout (milestone 1, v0.1.0 — Repo setup); its history is on main. The Excel/VBA prototype is also on main; Excel host evidence remains pending in #28.

      Use synthetic examples only. Report potential vulnerabilities privately via [SECURITY.md](https://github.com/danielep71/K-FRTB-SA/blob/main/SECURITY.md).

      Forms set the assignee and default labels; maintainers must confirm one priority and assign
      a milestone. P1 is reserved for confirmed calculation bugs.

      Read the [Code of Conduct](https://github.com/danielep71/K-FRTB-SA/blob/main/CODE_OF_CONDUCT.md) before submitting.'
- type: textarea
  id: objective
  attributes:
    label: Objective and user need
    description: Explain the problem and the concrete outcome.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Scope and non-goals
    description: Define intended behavior, affected interfaces, and compatibility impact. Functional
      work must identify platform/coverage decisions still needed.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List checkable outcomes, preferably as a Markdown checklist.
  validations:
    required: true
- type: textarea
  id: validation
  attributes:
    label: Validation and references
    description: Describe how the outcome will be verified. For future calculations, cite the
      regulatory source/profile and independent expected-value provenance; otherwise state Not
      applicable.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Dependencies and blockers
    description: Link related issues or decisions, or write None.
  validations:
    required: true
- type: checkboxes
  id: submission-checks
  attributes:
    label: Submission checks
    options:
    - label: I have read and will follow the Code of Conduct.
      required: true
    - label: I have excluded credentials, confidential data, and undisclosed vulnerability details.
      required: true
