name: "✨ Feature or improvement"
description: "Propose new behavior, a calculation change or a tooling improvement."
title: "[Feature]: "
labels: ["enhancement", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature or improvement

        **Outcome first · Cited rule · Checkable acceptance · Explicit boundaries**

        Describe the result you need and how it will be proved, before any implementation. A calculation change cites its MAR paragraph and states units and valid input domains. I set the milestone and confirm the priority (`P3` by default).

        > [!NOTE]
        > Synthetic data only: no real positions, counterparties, credentials or private links.

  - type: dropdown
    id: area
    attributes:
      label: "🎚️ Area"
      options:
        - Calculation engine (VBA)
        - Python reference and tests
        - Workbook template and layout
        - Excel tooling (build, sync, export)
        - CI and repository tooling
        - Documentation
        - Repository and governance
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem and user"
      description: What need is unmet, and for whom.
    validations:
      required: true

  - type: textarea
    id: requested
    attributes:
      label: "🧩 Requested behavior"
      description: The observable result. For a calculation change, cite the MAR paragraph and state units and valid input domains.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "📐 Scope and non-goals"
      description: What is in and out of this change.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🏁 Acceptance criteria"
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🧪 Validation evidence required"
      description: The checks and scenarios, and, for a calculation, the source of the expected values and their tolerance. Write "Not applicable" when none is needed.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: "💥 Compatibility impact"
      description: Effect on computed results, input or output sheet layouts, Control switches and supported hosts. Write "None" if there is none.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "🔗 Dependencies and blocking status"
      description: Name each prerequisite as an issue link (#12) or on a line starting "External condition:". Write "None" if nothing blocks this work. `blocked` applies only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "☑️ Submission checks"
      options:
        - label: I searched open and closed issues for an equivalent proposal.
          required: true
        - label: I separated the required behavior from implementation preferences.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: This proposal contains only synthetic data and no secrets or private links.
          required: true
