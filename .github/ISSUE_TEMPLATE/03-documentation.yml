name: "📚 Documentation change"
description: "Report missing, wrong, stale or unclear documentation."
title: "[Docs]: "
labels: ["documentation", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation change

        **Accurate · Current · Traceable to its source**

        Documentation must match the code, the recorded decisions and the cited Basel texts. I set the milestone and confirm the priority (`P3` by default).

  - type: input
    id: location
    attributes:
      label: "📍 Document and section"
      description: File and heading, or a link to the exact line on the active release branch.
      placeholder: docs/methodology.md → Curvature input contract
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: "🏷️ Problem type"
      options:
        - Incorrect behavior or contract
        - Stale version, count, command or evidence
        - Missing explanation or example
        - Unclear or ambiguous
        - Methodology or regulatory reference
        - Broken link or anchor
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Current problem and impact"
      description: What is wrong and whom it misleads.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: "✏️ Proposed correction"
      description: The requested change and its scope.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: "📚 Authoritative source"
      description: The code, contract, MAR paragraph or decision the corrected text must match.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🏁 Acceptance criteria"
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🧪 Validation evidence required"
      description: How the correction will be checked, for example `python tools/check_repository.py`, a rendered review or a link check.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "🔗 Dependencies and blocking status"
      description: Name each prerequisite as an issue link (#12) or on a line starting "External condition:". Write "None" if nothing blocks this work. `blocked` applies only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "☑️ Submission checks"
      options:
        - label: I checked the current documentation on the active release branch.
          required: true
        - label: I have read and will follow the Code of Conduct.
          required: true
        - label: This request contains no secrets, private links or real portfolio data.
          required: true
