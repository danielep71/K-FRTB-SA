name: 📚 Documentation change
description: Correct or improve an authoritative project document.
labels:
- documentation
- P3
assignees:
- danielep71
body:
- type: markdown
  attributes:
    value: '## 🧭 Before you submit

      Setup work integrates on release/v0.0.1; an Excel/VBA prototype exists on release/v0.1.0. Excel host evidence remains pending in #28.

      Use synthetic examples only. Report potential vulnerabilities privately via [SECURITY.md](https://github.com/danielep71/MKT-FTRB-SA/blob/main/SECURITY.md).

      Forms set the owner and default labels; maintainers must confirm one priority and assign
      a milestone. P1 is reserved for confirmed calculation bugs.

      Read the [Code of Conduct](https://github.com/danielep71/MKT-FTRB-SA/blob/main/CODE_OF_CONDUCT.md) before submitting.'
- type: textarea
  id: documents
  attributes:
    label: Affected authoritative documents
    description: Link the exact files/headings and commit or version. Identify which document
      owns the rule.
  validations:
    required: true
- type: textarea
  id: objective
  attributes:
    label: Objective and proposed correction
    description: Explain what is unclear or wrong and what the documentation should say.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List observable completion criteria, including affected navigation and links.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Validation and source evidence
    description: Provide supporting references or commands and describe how links, examples,
      and claims will be checked.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Dependencies and blockers
    description: Link related issues or decisions, or write None.
  validations:
    required: true
- type: checkboxes
  id: submission-checks
  attributes:
    label: Submission checks
    options:
    - label: I have read and will follow the Code of Conduct.
      required: true
    - label: I have excluded credentials, confidential data, and undisclosed vulnerability details.
      required: true
