version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.0.1
    schedule:
      interval: weekly
    assignees: [danielep71]
    labels: [repository, ci, P3]
    milestone: 1
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.1.0
    schedule:
      interval: weekly
    assignees: [danielep71]
    labels: [repository, ci, P3]
    milestone: 2
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /.github
    target-branch: release/v0.0.1
    schedule:
      interval: weekly
    assignees: [danielep71]
    labels: [repository, ci, P3]
    milestone: 1
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tests
    target-branch: release/v0.1.0
    schedule:
      interval: weekly
    assignees: [danielep71]
    labels: [repository, tests, P3]
    milestone: 2
    open-pull-requests-limit: 5
