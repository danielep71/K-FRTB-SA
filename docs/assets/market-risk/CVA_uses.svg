<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Where CVA risk fits in the capital framework</title><desc id="desc">A separate charge for adverse changes in credit valuation adjustment</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1100" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">Where CVA risk fits in the capital framework</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">A separate charge for adverse changes in credit valuation adjustment</text><path d="M800 546 L600 264" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 264" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L600 529" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 529" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L600 794" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 794" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="160" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="196" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">1 | The risk being capitalised</text><text x="62" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">CVA changes with counterparty credit quality</text><text x="62" y="258.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">and the market factors driving derivative</text><text x="62" y="287.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">exposure.</text><rect x="1000" y="160" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="196" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">2 | Covered transactions</text><text x="1022" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Start from the regulatory CVA perimeter:</text><text x="1022" y="258.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">covered derivatives and material SFT CVA risk,</text><text x="1022" y="287.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">with exemptions applied.</text><rect x="40" y="425" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="461" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">3 | BA-CVA route</text><text x="62" y="495" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Use supplied exposure values, effective</text><text x="62" y="523.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">maturities and counterparty characteristics.</text><text x="62" y="552.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Full BA-CVA recognises eligible credit hedges.</text><rect x="1000" y="425" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="461" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">4 | SA-CVA route</text><text x="1022" y="495" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Use regulatory CVA and eligible hedge</text><text x="1022" y="523.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">sensitivities. Supervisory approval and the</text><text x="1022" y="552.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">relevant risk-management capabilities are</text><text x="1022" y="580.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">required.</text><rect x="40" y="690" width="560" height="208" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="62" y="726" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">5 | Capital and RWA</text><text x="62" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Produce a CVA own funds requirement and its</text><text x="62" y="788.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">RWA equivalent. Add it separately in the bank-</text><text x="62" y="817.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">wide capital framework.</text><rect x="1000" y="690" width="560" height="208" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="1022" y="726" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">6 | Link to exposure engines</text><text x="1022" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">SA-CCR exposure can feed BA-CVA. SA-CVA</text><text x="1022" y="788.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">instead needs CVA sensitivities; EAD alone is</text><text x="1022" y="817.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">insufficient.</text><rect x="620" y="442" width="360" height="210" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="800" y="490" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">K-CVA</text><text x="800" y="537" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">REGULATORY CVA</text><text x="800" y="567" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">CAPITAL</text><text x="800" y="980" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">CVA valuation, CCR exposure and CVA capital are distinct measures</text><text x="36" y="1045" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Method map. Eligibility, exemptions and any simplified route depend on the applicable regulatory profile.</text><text x="36" y="1075" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR50; CRR Part Three, Title VI; Bundesbank, CVA risk.</text></svg>