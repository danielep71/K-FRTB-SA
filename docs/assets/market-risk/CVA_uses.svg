<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Where CVA risk fits in the capital framework</title><desc id="desc">A separate charge for adverse changes in credit valuation adjustment</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="920" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">Where CVA risk fits in the capital framework</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">A separate charge for adverse changes in credit valuation adjustment</text><rect x="40" y="150" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="186" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">1 | The risk being capitalized</text><text x="62" y="220" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">CVA changes with counterparty credit quality</text><text x="62" y="248.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">and the market factors driving derivative</text><text x="62" y="277.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">exposure.</text><rect x="1000" y="150" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="186" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">2 | Covered transactions</text><text x="1022" y="220" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Covered derivatives (QCCP trades excluded) and</text><text x="1022" y="248.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">fair-valued SFTs where CVA risk is material</text><text x="1022" y="277.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">(MAR50.5).</text><rect x="40" y="380" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="416" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">3 | BA-CVA route</text><text x="62" y="450" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Supplied exposure values, effective maturities</text><text x="62" y="478.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">and counterparty characteristics. Full BA-CVA</text><text x="62" y="507.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">recognizes eligible credit hedges.</text><rect x="1000" y="380" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="416" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">4 | SA-CVA route</text><text x="1022" y="450" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">CVA and hedge sensitivities; supervisory</text><text x="1022" y="478.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">approval required. Carved-out netting sets use</text><text x="1022" y="507.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">BA-CVA (MAR50.8).</text><rect x="40" y="610" width="560" height="160" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="62" y="646" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">5 | Capital and RWA</text><text x="62" y="680" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">CVA own funds requirement times 12.5. Up to</text><text x="62" y="708.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">EUR 100 billion non-centrally cleared</text><text x="62" y="737.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">notional: 100% of CCR capital (MAR50.9).</text><rect x="1000" y="610" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="646" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">6 | Link to exposure engines</text><text x="1022" y="680" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">SA-CCR exposure can feed BA-CVA. SA-CVA needs</text><text x="1022" y="708.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">CVA sensitivities; EAD alone is insufficient.</text><rect x="660" y="355" width="280" height="210" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="800" y="424" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">K-CVA</text><text x="800" y="484" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">REGULATORY CVA</text><text x="800" y="514" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">CAPITAL</text><path d="M600 270 L689 355" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1000 270 L911 355" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M660 460 L600 460" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M940 460 L1000 460" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M689 565 L600 650" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1000 650 L911 565" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="800" y="815" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">CVA valuation, CCR exposure and CVA capital are distinct measures</text><text x="36" y="865" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Method map. Eligibility, exemptions and the simplified route depend on the applicable regulatory profile.</text><text x="36" y="895" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR50; CRR Part Three, Title VI; Bundesbank, CVA risk.</text></svg>
