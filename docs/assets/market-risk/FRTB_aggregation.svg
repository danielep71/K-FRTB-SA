<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1352" viewBox="0 0 1600 1352" role="img" aria-labelledby="title desc"><title id="title">How FRTB-SA aggregates risk inputs</title><desc id="desc">Three calculation branches; one standardized capital requirement</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1352" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">How FRTB-SA aggregates risk inputs</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">Three calculation branches; one standardized capital requirement</text><rect x="32" y="140" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="140" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="96" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">ASSIGN INPUTS</text><text x="1544" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">keep valuation and risk-input production upstream</text><rect x="40" y="206" width="490" height="170" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SBM | RISK FACTORS</text><text x="62" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Delta and vega sensitivities;</text><text x="62" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">curvature inputs. Map to risk classes,</text><text x="62" y="335.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">factors and buckets.</text><rect x="555" y="206" width="490" height="170" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="577" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">DRC | POSITIONS</text><text x="577" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Jump-to-default inputs, issuer,</text><text x="577" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">seniority, maturity and bucket.</text><rect x="1070" y="206" width="490" height="170" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1092" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RRAO | INSTRUMENTS</text><text x="1092" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Gross notional and residual-risk</text><text x="1092" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">category. Apply the regulatory scope</text><text x="1092" y="335.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">tests.</text><path d="M285 376 L285 419" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 376 L800 419" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 376 L1315 419" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="424" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="424" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="453" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="96" y="453" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">CALCULATE EACH BRANCH</text><text x="1544" y="453" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">use the appropriate rules within each branch</text><rect x="40" y="490" width="490" height="330" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="526" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SBM | MAR21</text><text x="62" y="560" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Net sensitivities by risk factor;</text><text x="62" y="589.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">apply regulatory risk weights.</text><text x="62" y="627.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Aggregate within buckets, then across</text><text x="62" y="657.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">buckets, by risk class and risk</text><text x="62" y="687.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">measure.</text><text x="62" y="725.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">For curvature, apply its prescribed</text><text x="62" y="755.5199999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">upward/downward shock and aggregation</text><text x="62" y="785.4399999999997" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">rules.</text><rect x="555" y="490" width="490" height="330" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="577" y="526" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">DRC | MAR22</text><text x="577" y="560" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Determine gross jump-to-default and</text><text x="577" y="589.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">apply permitted netting.</text><text x="577" y="627.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Separate non-securitizations,</text><text x="577" y="657.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">securitizations and the correlation</text><text x="577" y="687.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">trading portfolio.</text><text x="577" y="725.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Apply default risk weights by credit</text><text x="577" y="755.5199999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">quality and the hedge benefit ratio</text><text x="577" y="785.4399999999997" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">per bucket.</text><rect x="1070" y="490" width="490" height="330" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1092" y="526" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RRAO | MAR23</text><text x="1092" y="560" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Identify instruments in the</text><text x="1092" y="589.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">residual-risk scope.</text><text x="1092" y="627.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Multiply gross notional by the</text><text x="1092" y="657.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">applicable residual-risk weight.</text><text x="1092" y="695.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Sum the instrument charges; no offset</text><text x="1092" y="725.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">against SBM or DRC.</text><path d="M285 820 L285 858" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 820 L800 858" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 820 L1315 858" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="868" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="62" y="904" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K<tspan dy="7" font-size="17">SBM</tspan><tspan dy="-7"></tspan></text><text x="62" y="938" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">For each correlation scenario, sum</text><text x="62" y="966.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">delta, vega and curvature across risk</text><text x="62" y="995.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">classes.</text><text x="62" y="1031.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Take the maximum scenario total.</text><rect x="555" y="868" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="577" y="904" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K<tspan dy="7" font-size="17">DRC</tspan><tspan dy="-7"></tspan></text><text x="577" y="938" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Sum the applicable default-risk</text><text x="577" y="967.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">capital components.</text><rect x="1070" y="868" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="1092" y="904" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K<tspan dy="7" font-size="17">RRAO</tspan><tspan dy="-7"></tspan></text><text x="1092" y="938" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Sum residual-risk charges on gross</text><text x="1092" y="967.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">notionals.</text><path d="M285 1048 L285 1086" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 1048 L800 1086" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 1048 L1315 1086" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="1092" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="1092" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="1121" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="96" y="1121" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">ADD THE THREE CAPITAL COMPONENTS</text><text x="558.0" y="1182" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" fill="#17365F" font-weight="700" text-anchor="start">K<tspan dy="10" font-size="23">FRTB-SA</tspan><tspan dy="-10"> = K<tspan dy="10" font-size="23">SBM</tspan><tspan dy="-10"> + K<tspan dy="10" font-size="23">DRC</tspan><tspan dy="-10"> + K<tspan dy="10" font-size="23">RRAO</tspan><tspan dy="-10"></tspan></tspan></tspan></tspan></text><text x="623.0" y="1226" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" fill="#24558D" font-weight="700" text-anchor="start">RWA<tspan dy="8" font-size="18">FRTB-SA</tspan><tspan dy="-8"> = 12.5 × K<tspan dy="8" font-size="18">FRTB-SA</tspan><tspan dy="-8"></tspan></tspan></text><text x="36" y="1297" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Full framework shown. The K-FRTB-SA prototype covers a subset; this diagram does not expand its implemented scope.</text><text x="36" y="1327" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR20.1 and MAR20.4; MAR21, MAR22 and MAR23.</text></svg>
