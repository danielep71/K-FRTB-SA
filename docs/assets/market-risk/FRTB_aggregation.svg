<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1410" viewBox="0 0 1600 1410" role="img" aria-labelledby="title desc"><title id="title">How FRTB-SA aggregates risk inputs</title><desc id="desc">Three calculation branches; one standardised capital requirement</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1410" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">How FRTB-SA aggregates risk inputs</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">Three calculation branches; one standardised capital requirement</text><rect x="32" y="140" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="140" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="96" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">ASSIGN INPUTS</text><text x="1544" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">keep valuation and risk-input production upstream</text><rect x="40" y="206" width="490" height="190" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SBM | RISK FACTORS</text><text x="62" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Delta and vega sensitivities;</text><text x="62" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">curvature inputs. Map to risk classes,</text><text x="62" y="335.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">factors and buckets.</text><rect x="555" y="206" width="490" height="190" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="577" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">DRC | POSITIONS</text><text x="577" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Jump-to-default inputs, issuer,</text><text x="577" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">seniority, maturity and bucket.</text><rect x="1070" y="206" width="490" height="190" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1092" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RRAO | INSTRUMENTS</text><text x="1092" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Gross notional and residual-risk</text><text x="1092" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">category. Apply the regulatory scope</text><text x="1092" y="335.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">tests.</text><path d="M285 396 L285 439" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 396 L800 439" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 396 L1315 439" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="444" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="444" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="473" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="96" y="473" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">CALCULATE EACH BRANCH</text><text x="1544" y="473" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">use the appropriate rules within each branch</text><rect x="40" y="510" width="490" height="356" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SBM | MAR21</text><text x="62" y="580" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Net sensitivities by risk factor;</text><text x="62" y="609.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">apply regulatory risk weights.</text><text x="62" y="647.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Aggregate within buckets, then across</text><text x="62" y="677.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">buckets, by risk class and risk</text><text x="62" y="707.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">measure.</text><text x="62" y="745.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">For curvature, apply its prescribed</text><text x="62" y="775.5199999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">upward/downward shock and aggregation</text><text x="62" y="805.4399999999997" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">rules.</text><rect x="555" y="510" width="490" height="356" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="577" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">DRC | MAR22</text><text x="577" y="580" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Determine gross jump-to-default and</text><text x="577" y="609.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">apply permitted netting.</text><text x="577" y="647.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Separate non-securitisations,</text><text x="577" y="677.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">securitisations and correlation-</text><text x="577" y="707.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">trading portfolios.</text><text x="577" y="745.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Apply bucket weights and permitted</text><text x="577" y="775.5199999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">hedge recognition under the relevant</text><text x="577" y="805.4399999999997" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">rules.</text><rect x="1070" y="510" width="490" height="356" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1092" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RRAO | MAR23</text><text x="1092" y="580" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Identify instruments in the residual-</text><text x="1092" y="609.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">risk scope.</text><text x="1092" y="647.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Multiply gross notional by the</text><text x="1092" y="677.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">applicable residual-risk weight.</text><text x="1092" y="715.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Sum the instrument charges; no offset</text><text x="1092" y="745.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">against SBM or DRC.</text><path d="M285 866 L285 904" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 866 L800 904" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 866 L1315 904" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="914" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="62" y="950" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K SBM</text><text x="62" y="984" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">For each correlation scenario, sum</text><text x="62" y="1012.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">delta, vega and curvature across risk</text><text x="62" y="1041.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">classes.</text><text x="62" y="1077.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Take the maximum scenario total.</text><rect x="555" y="914" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="577" y="950" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K DRC</text><text x="577" y="984" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Sum the applicable default-risk</text><text x="577" y="1013.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">capital components.</text><rect x="1070" y="914" width="490" height="180" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="1092" y="950" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">K RRAO</text><text x="1092" y="984" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Sum residual-risk charges on gross</text><text x="1092" y="1013.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">notionals.</text><path d="M285 1094 L285 1138" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 1094 L800 1138" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1315 1094 L1315 1138" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="1145" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="1145" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="1174" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="96" y="1174" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">ADD THE THREE CAPITAL COMPONENTS</text><text x="800" y="1236" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" fill="#17365F" font-weight="700" text-anchor="middle">K FRTB-SA = K SBM + K DRC + K RRAO</text><text x="800" y="1280" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" fill="#24558D" font-weight="700" text-anchor="middle">RWA FRTB-SA = 12.5 × K FRTB-SA</text><text x="36" y="1355" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Full framework shown. The K-FRTB-SA prototype covers a subset; this diagram does not expand its implemented scope.</text><text x="36" y="1385" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR20.1 and MAR20.4; MAR21, MAR22 and MAR23.</text></svg>