<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title desc"><title id="title">How CVA capital aggregates its inputs</title><desc id="desc">Choose the applicable approach for each covered portfolio</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1330" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">How CVA capital aggregates its inputs</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">Choose the applicable approach for each covered portfolio</text><rect x="32" y="140" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="140" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="96" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">DEFINE COVERAGE AND METHOD</text><text x="1544" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">identify exemptions and eligible hedges first</text><rect x="40" y="206" width="740" height="155" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">BA-CVA | EXPOSURE-BASED INPUTS</text><text x="62" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Netting-set exposure values, effective maturities,</text><text x="62" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">counterparty characteristics and eligible credit hedges.</text><rect x="820" y="206" width="740" height="155" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SA-CVA | SENSITIVITY-BASED INPUTS</text><text x="842" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Supplied regulatory CVA sensitivities and eligible hedge</text><text x="842" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">sensitivities; supervisory approval required.</text><path d="M410 361 L410 405" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 361 L1190 405" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="410" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="410" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="439" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="96" y="439" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">AGGREGATE UNDER THE CHOSEN APPROACH</text><text x="1544" y="439" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">BA-CVA and SA-CVA are alternative routes</text><rect x="40" y="476" width="740" height="340" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="512" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">BA-CVA</text><text x="62" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Build the stand-alone counterparty risk amounts from the</text><text x="62" y="575.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">relevant exposure and maturity inputs.</text><text x="62" y="613.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Reduced version: aggregate counterparty amounts with</text><text x="62" y="643.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">prescribed dependence; no hedge recognition.</text><text x="62" y="681.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Full version: recognise eligible credit hedges and retain</text><text x="62" y="711.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">the reduced-version component that limits hedge benefit.</text><rect x="820" y="476" width="740" height="340" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="512" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SA-CVA</text><text x="842" y="546" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Map CVA and hedge sensitivities to risk classes, risk</text><text x="842" y="575.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">factors and buckets.</text><text x="842" y="613.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Apply prescribed weights, hedge offsets and within-/across-</text><text x="842" y="643.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">bucket aggregation.</text><text x="842" y="681.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Aggregate delta and vega requirements. This route has no</text><text x="842" y="711.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">curvature or default-risk component.</text><path d="M410 816 L410 855" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 816 L1190 855" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="865" width="740" height="120" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="62" y="901" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">BA-CVA CAPITAL REQUIREMENT</text><text x="62" y="935" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Apply the selected version and relevant regulatory</text><text x="62" y="963.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">adjustments.</text><rect x="820" y="865" width="740" height="120" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="842" y="901" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">SA-CVA CAPITAL REQUIREMENT</text><text x="842" y="935" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Apply the prescribed aggregation and regulatory adjustments.</text><rect x="32" y="1030" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="1030" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="1059" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="96" y="1059" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">REPORT CVA CAPITAL SEPARATELY</text><text x="1544" y="1059" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">avoid counting the same portfolio twice</text><text x="800" y="1125" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" fill="#17365F" font-weight="700" text-anchor="middle">RWA CVA = 12.5 × K CVA</text><text x="800" y="1175" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#24558D" font-weight="700" text-anchor="middle">CVA capital supplements the bank-wide requirement; it is outside SBM + DRC + RRAO.</text><text x="36" y="1275" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Conceptual calculation map. It does not assert that either approach is currently implemented in K-CVA.</text><text x="36" y="1305" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR50; CRR Part Three, Title VI; Bundesbank, CVA risk.</text></svg>