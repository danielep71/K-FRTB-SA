<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc"><title id="title">How CVA capital aggregates its inputs</title><desc id="desc">Choose the applicable approach for each covered netting set</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1340" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">How CVA capital aggregates its inputs</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">Choose the applicable approach for each covered netting set</text><rect x="32" y="140" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="140" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="96" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">DEFINE COVERAGE AND METHOD</text><text x="1544" y="169" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">identify exemptions and eligible hedges first</text><rect x="40" y="206" width="740" height="140" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">BA-CVA | EXPOSURE-BASED INPUTS</text><text x="62" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Netting-set exposure values, effective maturities,</text><text x="62" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">counterparty characteristics and eligible credit hedges.</text><rect x="820" y="206" width="740" height="140" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="242" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SA-CVA | SENSITIVITY-BASED INPUTS</text><text x="842" y="276" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Supplied regulatory CVA sensitivities and eligible hedge</text><text x="842" y="305.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">sensitivities; supervisory approval required (MAR50.7).</text><rect x="40" y="362" width="1520" height="112" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="398" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">ALTERNATIVES AND CARVE-OUTS</text><text x="62" y="432" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">At or below EUR 100 billion of non-centrally cleared notional, CVA capital may equal 100% of CCR capital, with no hedge recognition</text><text x="62" y="460.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">(MAR50.9). With SA-CVA approval, carved-out netting sets use BA-CVA (MAR50.8).</text><path d="M410 474 L410 515" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 474 L1190 515" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="520" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="520" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="549" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="96" y="549" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">AGGREGATE UNDER THE CHOSEN APPROACH</text><text x="1544" y="549" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">BA-CVA and SA-CVA are alternative routes</text><rect x="40" y="586" width="740" height="290" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="622" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">BA-CVA</text><text x="62" y="656" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Build the stand-alone counterparty risk amounts from the</text><text x="62" y="685.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">relevant exposure and maturity inputs.</text><text x="62" y="723.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Reduced version: aggregate counterparty amounts with</text><text x="62" y="753.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">prescribed dependence; no hedge recognition.</text><text x="62" y="791.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Full version: recognize eligible credit hedges and retain</text><text x="62" y="821.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">the reduced-version component that limits hedge benefit.</text><rect x="820" y="586" width="740" height="290" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="622" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">SA-CVA</text><text x="842" y="656" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Map CVA and hedge sensitivities to risk classes, risk</text><text x="842" y="685.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">factors and buckets.</text><text x="842" y="723.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Apply prescribed weights, hedge offsets and</text><text x="842" y="753.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">within-/across-bucket aggregation.</text><text x="842" y="791.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Aggregate delta and vega requirements. This route has no</text><text x="842" y="821.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">curvature or default-risk component.</text><path d="M410 876 L410 915" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 876 L1190 915" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="925" width="740" height="120" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="62" y="961" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">BA-CVA CAPITAL REQUIREMENT</text><text x="62" y="995" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Apply the selected version and relevant regulatory</text><text x="62" y="1023.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">adjustments.</text><rect x="820" y="925" width="740" height="120" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="842" y="961" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">SA-CVA CAPITAL REQUIREMENT</text><text x="842" y="995" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="start">Apply the prescribed aggregation and regulatory adjustments.</text><rect x="32" y="1090" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="1090" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="1119" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="96" y="1119" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">REPORT CVA CAPITAL SEPARATELY</text><text x="1544" y="1119" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">never capitalize a netting set twice</text><text x="629.7" y="1185" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" fill="#17365F" font-weight="700" text-anchor="start">RWA<tspan dy="10" font-size="23">CVA</tspan><tspan dy="-10"> = 12.5 × K<tspan dy="10" font-size="23">CVA</tspan><tspan dy="-10"></tspan></tspan></text><text x="800" y="1235" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="#24558D" font-weight="700" text-anchor="middle">CVA capital supplements the bank-wide requirement; it is outside SBM + DRC + RRAO.</text><text x="36" y="1285" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Conceptual calculation map. It does not assert that either approach is currently implemented in K-CVA.</text><text x="36" y="1315" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR50; CRR Part Three, Title VI; Bundesbank, CVA risk.</text></svg>
