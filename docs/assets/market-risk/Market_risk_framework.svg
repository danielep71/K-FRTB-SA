<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1358" viewBox="0 0 1600 1358" role="img" aria-labelledby="title desc"><title id="title">MARKET RISK AND CVA RISK</title><desc id="desc">From supplied risk inputs to two distinct capital requirements</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1358" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">MARKET RISK AND CVA RISK</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">From supplied risk inputs to two distinct capital requirements</text><text x="800" y="137" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#17365F" font-weight="400" text-anchor="middle">K = own funds requirement       |       RWA = risk-weighted assets</text><rect x="32" y="170" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="170" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="96" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">DEFINE THE PERIMETER</text><text x="1544" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">regulatory scope and exemptions first</text><rect x="40" y="232" width="740" height="184" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="268" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">K-FRTB-SA | MARKET-RISK POSITIONS</text><text x="62" y="302" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Trading-book positions, plus relevant FX and commodity risk</text><text x="62" y="331.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">outside the trading book.</text><text x="62" y="369.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Capture market-price movements, jump-to-default and</text><text x="62" y="399.76000000000005" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">specified residual risks.</text><rect x="820" y="232" width="740" height="184" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="268" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">K-CVA | COVERED COUNTERPARTIES</text><text x="842" y="302" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Covered derivatives (QCCP trades excluded); fair-valued</text><text x="842" y="331.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">SFTs where CVA risk is material.</text><text x="842" y="369.84000000000003" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Capture changes in CVA from credit spreads and market risk</text><text x="842" y="399.76000000000005" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">factors.</text><path d="M410 416 L410 466" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 416 L1190 466" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="470" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="470" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="499" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="96" y="499" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">SUPPLY THE RIGHT INPUTS</text><text x="1544" y="499" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">pricing and exposure measurement happen upstream</text><rect x="40" y="532" width="740" height="270" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="568" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">FRTB STANDARDIZED APPROACH</text><text x="62" y="602" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">SBM: delta, vega and curvature inputs.</text><text x="62" y="639.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">DRC: position and issuer data. RRAO: gross notionals and</text><text x="62" y="669.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">residual-risk classification.</text><text x="62" y="707.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">Not shown: the internal models approach for approved desks</text><text x="62" y="737.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">(MAR30–33) and the simplified standardized approach</text><text x="62" y="767.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">(MAR40).</text><rect x="820" y="532" width="740" height="270" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="842" y="568" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">CVA CAPITAL APPROACH</text><text x="842" y="602" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">BA-CVA: exposure values, effective maturities, counterparty</text><text x="842" y="631.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">data and eligible hedges.</text><text x="842" y="669.8399999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">SA-CVA: regulatory CVA and hedge sensitivities; supervisory</text><text x="842" y="699.7599999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">approval required.</text><text x="842" y="737.6799999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">MAR50.9: up to EUR 100 billion of non-centrally cleared</text><text x="842" y="767.5999999999998" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#31445C" font-weight="400" text-anchor="start">notional, CVA capital may equal 100% of CCR capital.</text><path d="M410 802 L410 849" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 802 L1190 849" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="854" width="1536" height="42" rx="3" fill="#24558D" stroke="#24558D" stroke-width="2"/><rect x="32" y="854" width="48" height="42" rx="3" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="56" y="883" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="96" y="883" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="start">AGGREGATE WITHIN EACH FRAMEWORK</text><text x="1544" y="883" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" fill="#DBE7F7" font-weight="400" text-anchor="end">CVA is a separate capital calculation</text><rect x="40" y="916" width="740" height="160" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="62" y="952" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">FRTB-SA CAPITAL</text><text x="62" y="986" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">K<tspan dy="6" font-size="15">FRTB-SA</tspan><tspan dy="-6"> = K<tspan dy="6" font-size="15">SBM</tspan><tspan dy="-6"> + K<tspan dy="6" font-size="15">DRC</tspan><tspan dy="-6"> + K<tspan dy="6" font-size="15">RRAO</tspan><tspan dy="-6"></tspan></tspan></tspan></tspan></text><text x="62" y="1023.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">SBM takes the largest total across its three correlation</text><text x="62" y="1053.84" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">scenarios.</text><rect x="820" y="916" width="740" height="160" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="842" y="952" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="start">CVA CAPITAL</text><text x="842" y="986" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">SA-CVA, or BA-CVA; netting sets carved out of SA-CVA use</text><text x="842" y="1015.92" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">BA-CVA (MAR50.8).</text><text x="842" y="1053.84" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Never capitalize a netting set under both approaches.</text><path d="M410 1076 L410 1116" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1190 1076 L1190 1116" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="1124" width="740" height="58" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="62" y="1160" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RWA<tspan dy="7" font-size="17">FRTB-SA</tspan><tspan dy="-7"> = 12.5 × K<tspan dy="7" font-size="17">FRTB-SA</tspan><tspan dy="-7"></tspan></tspan></text><rect x="820" y="1124" width="740" height="58" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="842" y="1160" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">RWA<tspan dy="7" font-size="17">CVA</tspan><tspan dy="-7"> = 12.5 × K<tspan dy="7" font-size="17">CVA</tspan><tspan dy="-7"></tspan></tspan></text><text x="800" y="1233" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="middle">Two capital contributions. No CVA charge inside the FRTB-SA three-component sum.</text><text x="36" y="1303" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Conceptual architecture; not a statement of implemented coverage. Local rules and transitions must be checked separately.</text><text x="36" y="1333" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR10–23, MAR30–33, MAR40 and MAR50; CRR Part Three, Titles IV and VI; Art. 92.</text></svg>
