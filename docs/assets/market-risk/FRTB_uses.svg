<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Where FRTB-SA fits in the capital framework</title><desc id="desc">A market-risk aggregation framework built around supplied risk measures</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="1100" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">Where FRTB-SA fits in the capital framework</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">A market-risk aggregation framework built around supplied risk measures</text><path d="M800 546 L600 264" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 264" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L600 529" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 529" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L600 794" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M800 546 L1000 794" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="160" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="196" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">1 | Regulatory perimeter</text><text x="62" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Apply the trading-book boundary and the scope</text><text x="62" y="258.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">rules for FX and commodity positions.</text><rect x="1000" y="160" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="196" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">2 | Risk-measure inputs</text><text x="1022" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Supply sensitivities and curvature inputs from</text><text x="1022" y="258.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">upstream valuation systems; preserve units and</text><text x="1022" y="287.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">signs.</text><rect x="40" y="425" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="461" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">3 | Sensitivities-based method</text><text x="62" y="495" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Aggregate delta, vega and curvature by risk</text><text x="62" y="523.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">class and bucket. Compare three correlation</text><text x="62" y="552.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">scenarios.</text><rect x="1000" y="425" width="560" height="208" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="461" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">4 | Complementary charges</text><text x="1022" y="495" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">DRC addresses jump-to-default. RRAO covers</text><text x="1022" y="523.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">specified residual risks. Both supplement the</text><text x="1022" y="552.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">SBM charge.</text><rect x="40" y="690" width="560" height="208" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="62" y="726" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">5 | Capital and RWA</text><text x="62" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Add SBM, DRC and RRAO capital requirements.</text><text x="62" y="788.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Convert the resulting requirement to RWA using</text><text x="62" y="817.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">12.5.</text><rect x="1000" y="690" width="560" height="208" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="1022" y="726" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">6 | Benchmark and explain</text><text x="1022" y="760" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Compare bank aggregation with a transparent</text><text x="1022" y="788.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">reference; trace differences to inputs,</text><text x="1022" y="817.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">parameters and aggregation.</text><rect x="620" y="442" width="360" height="210" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="800" y="490" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">K-FRTB-SA</text><text x="800" y="537" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">SENSITIVITIES TO</text><text x="800" y="567" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">CAPITAL</text><text x="800" y="980" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">SBM + DRC + RRAO</text><text x="36" y="1045" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Framework illustration. Product scope, methodology profile and validation evidence must be stated separately.</text><text x="36" y="1075" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR11 and MAR20–23.</text></svg>