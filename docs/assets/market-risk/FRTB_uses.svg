<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Where FRTB-SA fits in the capital framework</title><desc id="desc">A market-risk aggregation framework built around supplied risk measures</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7999BF"/></marker></defs><rect width="1600" height="920" fill="white"/><text x="800" y="55" font-family="Arial, DejaVu Sans, sans-serif" font-size="38" fill="#17365F" font-weight="700" text-anchor="middle">Where FRTB-SA fits in the capital framework</text><text x="800" y="96" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="middle">A market-risk aggregation framework built around supplied risk measures</text><rect x="40" y="150" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="186" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">1 | Regulatory perimeter</text><text x="62" y="220" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Apply the trading-book boundary and the scope</text><text x="62" y="248.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">rules for FX and commodity positions.</text><rect x="1000" y="150" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="186" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">2 | Risk-measure inputs</text><text x="1022" y="220" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Supply sensitivities and curvature inputs from</text><text x="1022" y="248.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">upstream valuation systems; preserve units and</text><text x="1022" y="277.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">signs.</text><rect x="40" y="380" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="62" y="416" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">3 | Sensitivities-based method</text><text x="62" y="450" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Aggregate delta, vega and curvature by risk</text><text x="62" y="478.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">class and bucket. Compare three correlation</text><text x="62" y="507.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">scenarios.</text><rect x="1000" y="380" width="560" height="160" rx="10" fill="#EAF1FA" stroke="#B5CBE8" stroke-width="2"/><text x="1022" y="416" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">4 | Complementary charges</text><text x="1022" y="450" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">DRC addresses jump-to-default. RRAO covers</text><text x="1022" y="478.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">specified residual risks. Both supplement the</text><text x="1022" y="507.12" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">SBM charge.</text><rect x="40" y="610" width="560" height="160" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="62" y="646" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">5 | Capital and RWA</text><text x="62" y="680" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Add the SBM, DRC and RRAO capital</text><text x="62" y="708.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">requirements. Multiply the total by 12.5 for</text><text x="62" y="737.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">RWA (MAR20.1).</text><rect x="1000" y="610" width="560" height="160" rx="10" fill="#EAF5EF" stroke="#218452" stroke-width="2"/><text x="1022" y="646" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17365F" font-weight="700" text-anchor="start">6 | Benchmark and explain</text><text x="1022" y="680" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">Compare bank aggregation with a transparent</text><text x="1022" y="708.56" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">reference; trace differences to inputs,</text><text x="1022" y="737.1199999999999" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#31445C" font-weight="400" text-anchor="start">parameters and aggregation.</text><rect x="660" y="355" width="280" height="210" rx="10" fill="#17365F" stroke="#17365F" stroke-width="2"/><text x="800" y="424" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">K-FRTB-SA</text><text x="800" y="484" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">SENSITIVITIES TO</text><text x="800" y="514" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="white" font-weight="700" text-anchor="middle">CAPITAL</text><path d="M600 270 L689 355" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1000 270 L911 355" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M660 460 L600 460" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M940 460 L1000 460" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M689 565 L600 650" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M911 565 L1000 650" stroke="#7999BF" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="638.1" y="815" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" fill="#24558D" font-weight="400" text-anchor="start">K<tspan dy="6" font-size="16">FRTB-SA</tspan><tspan dy="-6"> = K<tspan dy="6" font-size="16">SBM</tspan><tspan dy="-6"> + K<tspan dy="6" font-size="16">DRC</tspan><tspan dy="-6"> + K<tspan dy="6" font-size="16">RRAO</tspan><tspan dy="-6"></tspan></tspan></tspan></tspan></text><text x="36" y="865" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" fill="#31445C" font-weight="400" text-anchor="start">Framework illustration. Product scope, methodology profile and validation evidence must be stated separately.</text><text x="36" y="895" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" fill="#24558D" font-weight="400" text-anchor="start">Sources: Basel MAR11 and MAR20–23.</text></svg>
